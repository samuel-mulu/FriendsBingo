services:
  - type: web
    name: friends-bingo-api
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npx prisma generate && npm run migrate:deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set in Render dashboard — must be real frontend URLs, not "*"
      - key: CORS_ORIGINS
        sync: false
      - key: CHAPA_API_KEY
        sync: false
      - key: TELEBIRR_MERCHANT_ID
        sync: false
      - key: TELEBIRR_APP_KEY
        sync: false
      - key: TELEBIRR_PRIVATE_KEY
        sync: false
      - key: ANDROID_LATEST_VERSION
        sync: false
      - key: ANDROID_LATEST_VERSION_CODE
        sync: false
      - key: ANDROID_MINIMUM_VERSION_CODE
        sync: false
      - key: ANDROID_APK_DOWNLOAD_URL
        sync: false
      - key: ANDROID_APK_SHA256
        sync: false
      - key: ANDROID_RELEASE_NOTES
        sync: false
      - key: ANDROID_FORCE_UPDATE
        sync: false
