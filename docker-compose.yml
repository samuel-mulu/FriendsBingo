services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friends}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-friends_bingo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-friends} -d ${POSTGRES_DB:-friends_bingo}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-friends}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-friends_bingo}
      DIRECT_URL: postgresql://${POSTGRES_USER:-friends}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-friends_bingo}
      PORT: "4000"
      NODE_ENV: production
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - realtime_private

  redis:
    image: redis:8.4.6-alpine
    profiles: [socket-redis]
    restart: unless-stopped
    # No host ports. PostgreSQL remains on the existing default network.
    networks:
      - realtime_private
    secrets:
      - redis_password
    command:
      - sh
      - -ec
      - |
        umask 077
        password=$$(cat /run/secrets/redis_password)
        printf '%s' "$$password" | grep -Eq '^[a-fA-F0-9]{64}$$'
        printf 'requirepass %s\n' "$$password" > /tmp/redis-auth.conf
        exec redis-server /tmp/redis-auth.conf --port 6379 --save "" --appendonly no
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:

networks:
  realtime_private:
    internal: true

secrets:
  redis_password:
    file: ./.secrets/redis-password
